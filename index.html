<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Assistant - Chatbot</title>
<style>
  :root {
    --bg: #0a0e1a; --panel: #0f1525; --surface: #151d30; --border: #1e2d4a;
    --accent: #00d4ff; --accent2: #7b61ff; --green: #00ff88; --red: #ff4d6d; 
    --text: #e2eaf5; --muted: #5a7090;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text); display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 20px; }
  h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 11px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 10px; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { font-size: 18px; flex-shrink: 0; }
  .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 15px; max-width: 80%; font-size: 13px; line-height: 1.6; word-wrap: break-word; }
  .msg.user .bubble { background: #1a2a4a; border: 1px solid rgba(0,212,255,0.3); }
  .bubble code { background: rgba(0,212,255,0.1); padding: 2px 6px; border-radius: 4px;
    color: var(--accent); font-family: monospace; font-size: 12px; }
  .bubble strong { color: var(--accent); font-weight: 600; }
  .bubble a { color: var(--accent); text-decoration: none; }
  .bubble pre { background: #060b14; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 12px; overflow-x: auto; font-family: monospace; font-size: 11px;
    color: #a8d8ea; margin-top: 8px; }
  .typing { display: flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
    animation: pulse 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  
  .input-area { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; }
  .input-row { display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; align-items: flex-end; }
  textarea { flex: 1; background: none; border: none; outline: none; color: var(--text);
    font-size: 13px; font-family: inherit; resize: none; max-height: 100px; }
  textarea::placeholder { color: var(--muted); }
  button { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none;
    border-radius: 8px; width: 36px; height: 36px; cursor: pointer; color: #fff; 
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .status-bar { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 8px 16px; font-size: 11px; text-align: center; color: var(--muted); }
  .status-bar strong { color: var(--accent); cursor: pointer; }
  .status-bar.error { color: var(--red); }
  .status-bar.error strong { color: var(--red); }
  .status-bar.ok { color: var(--green); }
</style>
</head>
<body>

<header>
  <h1>🤖 IT Assistant</h1>
  <div class="subtitle">Chatbot hỗ trợ CNTT</div>
</header>

<div class="status-bar ok" id="status">✓ Proxy: https://anthropic-proxy.vinhvtdlna.workers.dev</div>

<div id="chat"></div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" placeholder="Hỏi gì đó..." rows="1"></textarea>
    <button id="send" onclick="send()">➤</button>
  </div>
</div>

<script>
const PROXY_URL = 'https://anthropic-proxy.vinhvtdlna.workers.dev/';
const SYSTEM = `Bạn là IT Assistant - trợ lý chuyên gia CNTT cho Võ Tiến Vĩnh.
Trả lời tiếng Việt, chuyên nghiệp, ngắn gọn, chính xác.
Dùng **in đậm** cho từ khóa, \`code\` cho lệnh, block code cho script.
Chuyên môn: mạng máy tính, TCP/IP, bảo mật, Linux, lập trình, database, viễn thông, cáp quang.`;

let messages = [];
let isLoading = false;

function autoResize() {
  const input = document.getElementById('input');
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
}

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  
  let html = text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/```[\s\S]*?```/g, m => `<pre>${m.slice(3, -3)}</pre>`);
  
  div.innerHTML = `
    <div class="avatar">${role === 'bot' ? '🤖' : '👤'}</div>
    <div class="bubble">${html}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send').disabled = true;

  addMsg('user', text);
  messages.push({ role: 'user', content: text });

  // Typing
  const chat = document.getElementById('chat');
  const typing = document.createElement('div');
  typing.className = 'msg bot';
  typing.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  typing.id = 'typing';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    console.log('📤 Sending request to:', PROXY_URL);
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: messages
      })
    });

    console.log('📥 Response status:', res.status);
    const data = await res.json();
    console.log('📦 Response data:', data);

    document.getElementById('typing')?.remove();

    if (data.error) {
      addMsg('bot', `❌ **Lỗi:** ${data.error.message || JSON.stringify(data.error)}`);
      updateStatus(`❌ Lỗi API: ${data.error.message}`, 'error');
    } else if (data.content?.[0]?.text) {
      const reply = data.content[0].text;
      messages.push({ role: 'assistant', content: reply });
      addMsg('bot', reply);
      updateStatus('✓ Đã gửi thành công', 'ok');
    } else {
      addMsg('bot', '⚠️ **Lỗi:** Không nhận được response từ Claude');
      updateStatus('⚠️ Lỗi response', 'error');
    }
  } catch (error) {
    console.error('💥 Error:', error);
    document.getElementById('typing')?.remove();
    addMsg('bot', `❌ **Lỗi kết nối:** ${error.message}`);
    updateStatus(`❌ ${error.message}`, 'error');
  }

  isLoading = false;
  document.getElementById('send').disabled = false;
  input.focus();
}

function updateStatus(msg, type = 'ok') {
  const bar = document.getElementById('status');
  bar.textContent = msg;
  bar.className = `status-bar ${type}`;
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

document.getElementById('input').addEventListener('input', autoResize);

window.onload = () => {
  console.log('=== IT Assistant Chatbot ===');
  console.log('Proxy URL:', PROXY_URL);
  addMsg('bot', 'Xin chào! Tôi là IT Assistant. Hỏi tôi bất kỳ điều gì về CNTT, mạng, bảo mật, lập trình...');
};
</script>
</body>
</html>
